name: Release

on:
  push:
    tags:
      - 'wd-*'
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE="$(mktemp)"
          awk -v tag="$TAG" '
            BEGIN { prefix = "## [" tag "]" }
            index($0, prefix) == 1 && (length($0) == length(prefix) || substr($0, length(prefix) + 1, 3) == " - ") {
              in_section = 1
              next
            }
            in_section && ($0 ~ "^## \\[" || $0 ~ "^\\[[^]]+\\]: ") { exit }
            in_section {
              if (!started && $0 == "") next
              started = 1
              lines[++n] = $0
            }
            END {
              while (n > 0 && lines[n] == "") n--
              for (i = 1; i <= n; i++) print lines[i]
            }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "Error: no non-empty section found for [$TAG] in CHANGELOG.md" >&2
            exit 1
          fi

          SUBJECT="$(git for-each-ref "refs/tags/$TAG" --format='%(contents:subject)')"
          TITLE="${SUBJECT:-$TAG}"

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.changelog.outputs.notes_file }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.changelog.outputs.title }}
        run: |
          PRERELEASE_FLAG=""
          case "$TAG" in
            wd-*|*-*) PRERELEASE_FLAG="--prerelease" ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" $PRERELEASE_FLAG
          else
            gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" $PRERELEASE_FLAG
          fi
